<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | MS Tech</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-box"><a class="logo" style="color:#111" href="index.html">MS<span>TECH</span></a><h1>Área Administrativa</h1><p>Acesse o painel de gerenciamento.</p><form id="loginForm"><input id="user" placeholder="Usuário" required><input id="pass" type="password" placeholder="Senha" required><div class="error" id="error"></div><button class="btn">Entrar</button></form><p style="margin-top:18px;font-size:12px;color:#666">Acesso de demonstração: <b>admin</b> / <b>1234</b></p></div><script>document.querySelector('#loginForm').addEventListener('submit',e=>{e.preventDefault();if(user.value==='maison'&&pass.value==='1234'){sessionStorage.setItem('ms_admin','1');location.href='painel.html'}else error.textContent='Usuário ou senha inválidos. O acesso informado é apenas para demonstração.'})</script></body></html>
